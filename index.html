const CATEGORIES=['All domains','Cloud Computing','Excel','Cyber Security','Wireless Security','Computer Networks','MS Office','Computer Fundamentals'];
let quiz=[],idx=0,answers={},score=0,shuffleOptions=false,timerId=null,autoId=null,timeLeft=10,activeCategory='All domains';
const $=id=>document.getElementById(id),letters='ABCDE',SAVE='accenture-mcq-progress-v2';
function shuffled(a){return [...a].sort(()=>Math.random()-.5)}
function setupDomains(){$('domainSelect').innerHTML=CATEGORIES.map(c=>`<option value="${c}">${c}</option>`).join('')}
function filteredData(cat){return cat==='All domains'?[...DATA]:DATA.filter(q=>q.category===cat)}
function start(category=$('domainSelect').value,keep=false){clearTimers();activeCategory=category;shuffleOptions=$('shuffleO').checked;const saved=keep?load():null;if(saved){quiz=saved.quiz;idx=saved.idx;answers=saved.answers||{};score=saved.score||0;shuffleOptions=!!saved.shuffleOptions;activeCategory=saved.category||'All domains'}else{const base=filteredData(category);quiz=$('shuffleQ').checked?shuffled(base):base;idx=0;answers={};score=0;save()}$('start').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');renderNav();render()}
function save(){try{localStorage.setItem(SAVE,JSON.stringify({quiz,idx,answers,score,shuffleOptions,category:activeCategory}))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(SAVE)||'null');return x&&Array.isArray(x.quiz)&&x.quiz.length?x:null}catch(e){return null}}
function clearSave(){try{localStorage.removeItem(SAVE)}catch(e){}}
function showContinue(){const x=load();if(!x){$('continueBox').classList.remove('show');return}$('continueText').textContent=`Question ${Math.min(x.idx+1,x.quiz.length)} of ${x.quiz.length} · ${x.category}`;$('continueBox').classList.add('show')}
function renderNav(){$('nav').innerHTML=quiz.map((q,i)=>`<button class="dot" id="dot${i}" onclick="jump(${i})">${i+1}</button>`).join('')}
function render(){clearTimers();const q=quiz[idx];$('qNum').textContent=`QUESTION ${idx+1} / ${quiz.length}`;$('sideQ').textContent=`${idx+1} / ${quiz.length}`;$('sourcePage').textContent=`Source ${q.page}`;$('domainTag').textContent=q.category;$('sideDomain').textContent=q.category;$('question').textContent=q.question;$('sideScore').textContent=score;$('sideAnswered').textContent=Object.keys(answers).length;$('progress').style.width=((idx+1)/quiz.length*100)+'%';let opts=q.options.map((text,i)=>({text,correct:letters[i]===q.answer,original:i}));if(shuffleOptions)opts=shuffled(opts);$('options').innerHTML=opts.map((o,i)=>`<button class="option" data-correct="${o.correct}" data-text="${encodeURIComponent(o.text)}"><span class="letter">${letters[i]}</span><span>${escapeHtml(o.text)}</span></button>`).join('');document.querySelectorAll('.option').forEach((b,i)=>b.onclick=()=>choose(b,opts[i]));$('feedback').classList.add('hidden');$('nextBtn').textContent=idx===quiz.length-1?'Finish':'Skip';updateNav();if(answers[idx])showSaved(answers[idx]);startTimer()}
function choose(btn,opt){if(answers[idx])return;clearTimers();const wasCorrect=!!opt.correct;answers[idx]={correct:wasCorrect,text:opt.text,correctLetter:quiz[idx].answer};if(wasCorrect)score++;document.querySelectorAll('.option').forEach((x,j)=>{x.classList.add('locked');const isCorrect=x.dataset.correct==='true';if(isCorrect)x.classList.add('correct');if(x===btn&&!wasCorrect)x.classList.add('incorrect');if(x===btn&&wasCorrect)x.classList.add('selected')});showFeedback(answers[idx]);save();updateNav();autoId=setTimeout(next,2500)}
function showFeedback(a){$('feedback').innerHTML=(a.correct?'<strong>Correct.</strong>':'<strong>Not quite.</strong>')+` The answer is <strong>${a.correctLetter}</strong>: ${escapeHtml(quiz[idx].options[a.correctLetter.charCodeAt(0)-65])}`;$('feedback').classList.remove('hidden')}
function showSaved(a){document.querySelectorAll('.option').forEach(x=>{x.classList.add('locked');if(x.dataset.correct==='true')x.classList.add('correct');if(decodeURIComponent(x.dataset.text)===a.text&&!a.correct)x.classList.add('incorrect')});showFeedback(a)}
function updateNav(){quiz.forEach((_,i)=>{const b=$('dot'+i);if(!b)return;b.className='dot';if(i===idx)b.classList.add('current');if(answers[i])b.classList.add(answers[i].correct?'done':'wrong')})}
function startTimer(){timeLeft=10;$('timer').textContent='10s';$('timerFill').style.width='100%';timerId=setInterval(()=>{timeLeft--;$('timer').textContent=timeLeft+'s';$('timerFill').style.width=(timeLeft/10*100)+'%';if(timeLeft<=0){clearTimers();if(!answers[idx]){answers[idx]={correct:false,text:'Not answered',correctLetter:quiz[idx].answer};save();updateNav()}next()}},1000)}
function clearTimers(){if(timerId)clearInterval(timerId);if(autoId)clearTimeout(autoId);timerId=null;autoId=null}
function next(){clearTimers();if(idx<quiz.length-1){idx++;save();render()}else finish()}
function jump(n){clearTimers();idx=n;save();render()}
function finish(){clearTimers();clearSave();$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const pct=Math.round(score/quiz.length*100);$('finalScore').textContent=pct+'%';$('finalText').textContent=`${score} correct out of ${quiz.length} · ${activeCategory}`;$('resultFill').style.width=pct+'%';$('review').classList.add('hidden')}
function review(){const r=$('review');r.innerHTML='<h3>Answer review</h3>';quiz.forEach((q,i)=>{const a=answers[i];const d=document.createElement('div');d.className='reviewrow';d.innerHTML=`<div class="rtitle">${i+1}. ${escapeHtml(q.question)}</div><div class="answer">Your answer: ${a?escapeHtml(a.text):'Not answered'} · Answer: ${q.answer}. ${escapeHtml(q.options[q.answer.charCodeAt(0)-65])}</div>`;r.appendChild(d)});r.classList.remove('hidden')}
function escapeHtml(s){return String(s).replace(/[&<>']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;'}[c]))}
$('startBtn').onclick=()=>start();$('continueBtn').onclick=()=>start('',true);$('nextBtn').onclick=next;$('againBtn').onclick=()=>{clearSave();$('result').classList.add('hidden');$('start').classList.remove('hidden');showContinue()};$('reviewBtn').onclick=review;$('domainSelect').onchange=showContinue;$('restartTop').onclick=()=>{clearTimers();clearSave();$('quiz').classList.add('hidden');$('result').classList.add('hidden');$('start').classList.remove('hidden');showContinue()};document.addEventListener('keydown',e=>{if($('quiz').classList.contains('hidden'))return;if(['a','b','c','d','e'].includes(e.key.toLowerCase())&&!answers[idx]){const k=letters.indexOf(e.key.toUpperCase());const b=document.querySelectorAll('.option')[k];if(b)b.click()}if(e.key==='ArrowRight')next();if(e.key==='ArrowLeft'&&idx>0){idx--;save();render()}});setupDomains();showContinue();
</script></body></html>
